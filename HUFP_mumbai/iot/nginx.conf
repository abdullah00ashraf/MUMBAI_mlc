# SENTINEL V7 - TRACK GAMMA: NGINX PROXY CONFIGURATION
# Hybrid TLS 1.3 + ML-KEM Cryptographic Bridge

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # SSL/TLS Hardening
    ssl_protocols TLSv1.3; # Strictly TLS 1.3 for Track Alpha/Beta
    ssl_prefer_server_ciphers off;

    # Cipher Suites: Combined ECDHE + NIST ML-KEM
    # Note: Requires OpenSSL 3.2+ with OQS (Open Quantum Safe) provider
    ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256";

    upstream sentinel_backend {
        server localhost:8000;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name sentinel-v7.mumbai.gov;

        ssl_certificate /etc/sentinel/certs/fullchain.pem;
        ssl_certificate_key /etc/sentinel/certs/privkey.pem;

        # HSTS (1 Year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # Application Integrity Headers (tighten script-src to match your pinned CDN hosts or vendor locally)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://api.nasa.gov https://tile.openstreetmap.org;" always;

        location /api/v1/ {
            proxy_pass http://sentinel_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 50ms Latency Audit Tuning
            proxy_connect_timeout 50ms;
            proxy_send_timeout 50ms;
            proxy_read_timeout 50ms;
            
            # Security Handshake Pass-through
            proxy_set_header X-Timestamp $http_x_timestamp;
            proxy_set_header X-Nonce $http_x_nonce;
            proxy_set_header X-Signature $http_x_signature;
        }

        location / {
            root /var/www/sentinel/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
