<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V7 | Interactive Descent</title>
    
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000103; 
            font-family: 'Inter', sans-serif;
            perspective: 1000px;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
        }

        #magnetic-cursor {
            position: fixed;
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 50%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), 0 0 60px rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #glass-threshold {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(10, 15, 25, 0.15);
            backdrop-filter: blur(30px) saturate(130%);
            -webkit-backdrop-filter: blur(30px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #glass-text {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .glass-shard {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0;
            pointer-events: none;
        }

        #shockwave {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 10px; height: 10px; border-radius: 50%; background: #fff;
            box-shadow: 0 0 100px 50px #fff; opacity: 0; z-index: 9002; pointer-events: none;
        }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 101; pointer-events: none;
            background: radial-gradient(circle, transparent 35%, rgba(0, 0, 2, 0.98) 100%);
        }

        #scroll-hint {
            position: fixed; bottom: 40px; width: 100%; text-align: center; color: rgba(255, 255, 255, 0.5);
            font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.5em; z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <canvas id="trail-canvas"></canvas>
    <div id="magnetic-cursor"></div>

    <div id="glass-threshold">
        <div id="glass-text">KNOCK ME OFF</div>
    </div>
    <div id="shockwave"></div>

    <div class="vignette"></div>
    <div id="scroll-hint">SCROLL TO DESCEND OR AWAIT AUTOPILOT</div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer, clock;
        let nebulaLayers = []; 
        
        let isJourneyActive = false;
        let isFadingOut = false;
        let hasUserScrolled = false;
        let autoPilotTween;
        let idleTimer; // Track inactivity
        
        let targetZ = 45000; 
        let currentZ = 45000; 
        
        let mouseX = 0, mouseY = 0;
        let ballX = 0, ballY = 0; 
        let targetX = 0, targetY = 0;
        let ballScale = 1;

        const trailParticles = [];
        const trailCanvas = document.getElementById('trail-canvas');
        const trailCtx = trailCanvas.getContext('2d');

        init();
        animate();
        setupGlassShatter();
        setupScrollPhysics();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000103, 0.00006); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 60000);
            camera.position.z = 45000; 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            const renderScene = new RenderPass(scene, camera);
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);

            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 1.6, 0.15);
            composer.addPass(bloomPass);

            createVolumetricNebula();
            resizeTrailCanvas();
            
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                targetX = (e.clientX - (window.innerWidth / 2));
                targetY = (e.clientY - (window.innerHeight / 2));
                
                // Restart idle logic on movement
                if (isJourneyActive) resetIdleTimer();
            }, false);
            
            window.addEventListener('resize', () => {
                onWindowResize();
                resizeTrailCanvas();
            }, false);
        }

        // Handle the 1.5s idle logic
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (isFadingOut) return;
            
            idleTimer = setTimeout(() => {
                if (isJourneyActive && !isFadingOut) {
                    startAutoPilot();
                }
            }, 1500); 
        }

        function startAutoPilot() {
            if (autoPilotTween) autoPilotTween.kill();
            hasUserScrolled = false; // Transition control back to auto
            
            let proxy = { z: currentZ };
            autoPilotTween = gsap.to(proxy, {
                z: -4000, 
                duration: 12, 
                ease: "power2.inOut",
                onStart: () => { document.getElementById('scroll-hint').style.opacity = 0; },
                onUpdate: () => { if (!hasUserScrolled && !isFadingOut) targetZ = proxy.z; }
            });
        }

        function resizeTrailCanvas() {
            trailCanvas.width = window.innerWidth;
            trailCanvas.height = window.innerHeight;
        }

        function createGasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,0.5)'); 
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.15)');
            gradient.addColorStop(0.8, 'rgba(255,255,255,0.01)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function createVolumetricNebula() {
            const softTexture = createGasTexture();
            const layerConfigs = [
                { count: 180000, size: 180, radiusMulti: 3500, opacity: 0.04 }, 
                { count: 101000, size: 130, radiusMulti: 1800, opacity: 0.12 }, 
                { count: 50000,  size: 80,  radiusMulti: 600,  opacity: 0.35 }  
            ];
            const customPalette = [0x0a1930, 0x7700ff, 0x00e5ff, 0xff0055, 0xffd700];

            layerConfigs.forEach((config) => {
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(config.count * 3);
                const colors = new Float32Array(config.count * 3);

                for (let i = 0; i < config.count; i++) {
                    const r = Math.pow(Math.random(), 1.5) * config.radiusMulti + 80;
                    const theta = Math.random() * Math.PI * 2;
                    const zPos = Math.random() * 55000 - 5000; 
                    pos[i * 3] = r * Math.cos(theta + (zPos * 0.00025));
                    pos[i * 3 + 1] = r * Math.sin(theta + (zPos * 0.00025));
                    pos[i * 3 + 2] = zPos;
                    const randomColor = new THREE.Color(customPalette[Math.floor(Math.random() * customPalette.length)]);
                    colors[i * 3] = randomColor.r; colors[i * 3 + 1] = randomColor.g; colors[i * 3 + 2] = randomColor.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({ size: config.size, map: softTexture, vertexColors: true, transparent: true, opacity: config.opacity, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false });
                const points = new THREE.Points(geo, mat);
                scene.add(points);
                nebulaLayers.push(points);
            });
        }

        function setupGlassShatter() {
            const glassContainer = document.getElementById('glass-threshold');
            const glassText = document.getElementById('glass-text');
            const shockwave = document.getElementById('shockwave');
            const ball = document.getElementById('magnetic-cursor');

            glassContainer.addEventListener('click', (e) => {
                glassText.style.opacity = 0;
                gsap.to(ball, { opacity: 1, scale: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" });
                gsap.to(shockwave, { scale: 150, opacity: 1, duration: 0.2, ease: "expo.in" });
                gsap.to(shockwave, { opacity: 0, duration: 0.8, delay: 0.2, ease: "power2.out" });

                const polygons = ["polygon(0 0, 50% 50%, 0 100%)", "polygon(0 0, 100% 0, 50% 50%)", "polygon(100% 0, 100% 100%, 50% 50%)", "polygon(0 100%, 50% 50%, 100% 100%)"];
                for(let i=0; i<4; i++) {
                    const shard = document.createElement('div');
                    shard.className = 'glass-shard';
                    shard.style.clipPath = polygons[i]; shard.style.opacity = 1;
                    document.body.appendChild(shard);
                    gsap.to(shard, { x: (i%2==0?-300:300), y: (i<2?-300:300), rotation: 25, opacity: 0, duration: 1.2, ease: "power3.out", onComplete: () => shard.remove() });
                }

                glassContainer.style.background = 'transparent'; glassContainer.style.backdropFilter = 'none'; glassContainer.style.pointerEvents = 'none';
                isJourneyActive = true;
                document.getElementById('scroll-hint').style.opacity = 1;

                // Initial grace period before autopilot starts
                idleTimer = setTimeout(() => {
                    if (!hasUserScrolled) startAutoPilot();
                }, 1000); 
            });
        }

        function setupScrollPhysics() {
            window.addEventListener('wheel', (e) => {
                if (!isJourneyActive || isFadingOut) return;
                
                resetIdleTimer();

                if (!hasUserScrolled) {
                    hasUserScrolled = true;
                    if (autoPilotTween) autoPilotTween.kill();
                    document.getElementById('scroll-hint').style.opacity = 0;
                }
                targetZ -= e.deltaY * 35; targetZ = Math.min(45000, targetZ); 
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateTrail() {
            if (isJourneyActive) {
                trailParticles.push({
                    x: ballX,
                    y: ballY,
                    size: 15 + Math.random() * 20,
                    life: 1.0, 
                    color: Math.random() > 0.5 ? '#baff00' : '#00ffff' 
                });
            }

            trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

            for (let i = trailParticles.length - 1; i >= 0; i--) {
                const p = trailParticles[i];
                p.life -= 0.035; 
                p.size *= 0.96; 

                if (p.life <= 0) {
                    trailParticles.splice(i, 1);
                    continue;
                }

                trailCtx.globalAlpha = p.life;
                trailCtx.fillStyle = p.color;
                trailCtx.shadowBlur = 15;
                trailCtx.shadowColor = p.color;
                trailCtx.beginPath();
                trailCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                trailCtx.fill();
                trailCtx.shadowBlur = 0; 

                if(Math.random() > 0.85) {
                    trailCtx.fillStyle = '#ffffff';
                    trailCtx.beginPath();
                    trailCtx.arc(p.x, p.y, p.size * 0.35, 0, Math.PI * 2);
                    trailCtx.fill();
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            const lerpSpeed = 0.08; 
            ballX += (mouseX - ballX) * lerpSpeed;
            ballY += (mouseY - ballY) * lerpSpeed;
            
            const ball = document.getElementById('magnetic-cursor');
            if(ball) {
                const dist = Math.sqrt(Math.pow(mouseX - ballX, 2) + Math.pow(mouseY - ballY, 2));
                const scaleTarget = 1 + (dist / 1000); 
                ballScale += (scaleTarget - ballScale) * 0.1;
                
                ball.style.transform = `translate(-50%, -50%) scale(${ballScale})`;
                ball.style.left = `${ballX}px`;
                ball.style.top = `${ballY}px`;
            }

            updateTrail();

            camera.position.x += (targetX * 0.8 - camera.position.x) * 0.012;
            camera.position.y += (-targetY * 0.8 - camera.position.y) * 0.012;
            camera.rotation.y = -camera.position.x * 0.0003;
            camera.rotation.x = -camera.position.y * 0.0003;
            camera.rotation.z = -camera.position.x * 0.00015;

            if (isJourneyActive) {
                currentZ += (targetZ - currentZ) * 0.015;
                camera.position.z = currentZ;

                let progress = (45000 - currentZ) / 49000;
                progress = Math.max(0, Math.min(1, progress)); 
                camera.fov = 75 + (Math.log1p(progress) * 85);
                camera.updateProjectionMatrix();

                if (currentZ < -3500 && !isFadingOut) {
                    isFadingOut = true;
                    gsap.to("body", { opacity: 0, duration: 1.5, ease: "power2.inOut", onComplete: () => { window.location.href = 'index.html'; } });
                }
            }

            nebulaLayers.forEach((layer, i) => {
                const layerDrag = 0.02 + (i * 0.015);
                layer.rotation.z -= delta * layerDrag;
                layer.position.x = Math.sin(time * 0.5 + i) * 10;
                layer.position.y = Math.cos(time * 0.4 + i) * 10;
            });

            composer.render();
        }
    </script>
</body>
</html>
